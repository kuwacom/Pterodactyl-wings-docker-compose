services:
  wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: pterodactyl-wings
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      # config.yml / lib / log を1つのマウントにまとめる
      # config.yml の system セクションで root_directory / log_directory を
      # /etc/pterodactyl/lib / /etc/pterodactyl/log に変更すること
      - ./pterodactyl/:/etc/pterodactyl/

      # data はゲームサーバーコンテナ（兄弟コンテナ）にバインドマウントされるため、
      # ホストとコンテナで同じ絶対パスにする必要がある
      # VOLUME_PATH は config.yml の system.data と同じ値にすること
      # 複数ディスクを使いたい場合は mergerfs 等で統合してからマウントする
      - ${VOLUME_PATH:-/volumes}:${VOLUME_PATH:-/volumes}

      - "./certs:/etc/certs:ro"
    ports:
      - "${SFTP_PORT:-2022}:${SFTP_PORT:-2022}" # SFTP (マシンでポートを直接公開)
      - "127.0.0.1:443:443" # Wings API configに合わせて変更する
    environment:
      TZ: "Asia/Tokyo"

  cloudflared:
    image: cloudflare/cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=${TUNNEL_TRANSPORT_PROTOCOL:-http2}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: service:wings

